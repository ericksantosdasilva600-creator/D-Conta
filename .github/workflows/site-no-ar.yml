# Confere de 6 em 6 horas se o site e o app do Dá Conta estão no ar.
# Se algum endereço falhar, abre uma issue no GitHub (o GitHub avisa o dono por e-mail e no app).
# Quando tudo volta a responder, fecha a issue sozinho.
name: Site no ar

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - name: Testar os endereços
        id: teste
        run: |
          falhas=""
          for url in \
            "https://ericksantosdasilva600-creator.github.io/D-Conta/" \
            "https://ericksantosdasilva600-creator.github.io/D-Conta/app/" \
            "https://ericksantosdasilva600-creator.github.io/D-Conta/calculadoras/"; do
            ok=0
            for tentativa in 1 2 3; do
              codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url" || echo 000)
              if [ "$codigo" = "200" ]; then ok=1; break; fi
              sleep 20
            done
            if [ "$ok" = "0" ]; then falhas="$falhas\n- $url (resposta $codigo)"; fi
          done
          {
            echo "falhas<<FIM"
            printf "%b\n" "$falhas"
            echo "FIM"
          } >> "$GITHUB_OUTPUT"

      - name: Abrir ou fechar o aviso
        uses: actions/github-script@v7
        env:
          FALHAS: ${{ steps.teste.outputs.falhas }}
        with:
          script: |
            const titulo = "Site do Dá Conta fora do ar";
            const falhas = (process.env.FALHAS || "").trim();
            const { data: abertas } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100,
            });
            const aviso = abertas.find(i => i.title === titulo);
            if (falhas) {
              const corpo = `Estes endereços não responderam em ${new Date().toISOString()}:\n${falhas}\n\nVerifique o GitHub Pages em Settings > Pages.`;
              if (aviso) {
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: aviso.number, body: corpo });
              } else {
                await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: titulo, body: corpo });
              }
              core.setFailed("Site fora do ar");
            } else if (aviso) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: aviso.number, body: "Voltou ao ar. Fechando o aviso." });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: aviso.number, state: "closed" });
            }
